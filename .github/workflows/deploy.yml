name: Deploy to Production
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway deploy image
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway api \
            'mutation UpdateService($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) {
              serviceInstanceUpdate(serviceId: $serviceId environmentId: $environmentId input: $input) 
          }' \
          --variables '{
            "serviceId":"${{ vars.RAILWAY_SERVICE_ID }}",
            "environmentId":"${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}",
            "input":{
              "source":{
                "image":"reviendra/booking-service:${{ inputs.image_tag }}"
              }
            }
          }'

      - name: Deploy to production
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway api \
            'mutation DeployService($serviceId: String!, $environmentId: String!) {
              serviceInstanceDeployV2(serviceId: $serviceId environmentId: $environmentId) 
          }' \
          --variables '{
            "serviceId":"${{ vars.RAILWAY_SERVICE_ID }}",
            "environmentId":"${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}"
          }'