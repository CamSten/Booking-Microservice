name: Railway Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.63.1

      - name: List Production deployments
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway deployment list \
            --project 4fd9a5e1-d80f-425a-9ce1-09d9ca994bb0 \
            --environment c42825b7-08da-4323-8206-47a4438d80fd \
            --service c64941f4-3dea-4a22-820b-b83cdaa6f079 \
            --limit 20