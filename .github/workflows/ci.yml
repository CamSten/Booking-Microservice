name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - run: ./mvnw -B package
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_ACCOUNT }}
          password: ${{ secrets.DH_ACCESS_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker build -t reviendra/booking-service:latest -t reviendra/booking-service:${{ github.sha }} .

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push reviendra/booking-service:latest
          docker push reviendra/booking-service:${{ github.sha }}

      - name: Install Railway CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm install -g @railway/cli

      - name: Set Railway staging image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway api 'mutation UpdateService($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId environmentId: $environmentId input: $input) }' \
          --variables '{"serviceId":"c64941f4-3dea-4a22-820b-b83cdaa6f079","environmentId":"01d9feb4-76da-4915-9c88-c4e1556f3ea4","input":{"source":{"image":"reviendra/booking-service:${{ github.sha }}"}}}'

      - name: Deploy to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          railway api 'mutation DeployService($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId environmentId: $environmentId) }' \
          --variables '{"serviceId":"c64941f4-3dea-4a22-820b-b83cdaa6f079","environmentId":"01d9feb4-76da-4915-9c88-c4e1556f3ea4"}'