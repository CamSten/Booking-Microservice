<div th:fragment="hero">
    <div class="hero">
        <nav class="navbar navbar-expand-lg w-100 position-absolute top-0 start-0 z-3 p-3">
            <div class="container">
                <a class="navbar-brand hero-home-link" href="/home">HOME</a>
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-4">
                        <li class="nav-item" th:unless="${hideAllRooms == true}">
                            <a class="nav-link hero-nav-link" href="/home">View All Rooms</a>
                        </li>
                        <li class="nav-item" th:unless="${hideSearch == true}">
                            <a class="nav-link hero-nav-link" href="/search">Search Dates</a>
                        </li>
                        <li class="nav-item ms-2" th:unless="${loggedIn}">
                            <a class="nav-link hero-login-link" href="/customer">Login</a>
                        </li>
                        <li class="nav-item ms-2" th:if="${loggedIn}">
                            <a class="nav-link hero-login-link" href="/profile">Profile</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="hero-content">
            <h1 class="header-title">L'Hôtel de Ville</h1>
            <p class="subtitle">Bed &amp; Breakfast</p>
        </div>
    </div>
</div>
