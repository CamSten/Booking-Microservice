<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Room details')}"></head>
<body>
<div th:replace="~{fragments/hero :: hero}"></div>
<main class="container my-5">
    <input type="hidden" id="room-number" th:value="${room.getRoomNumber()}">
    <input type="hidden" id="room-id" th:value="${room.id}">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="booking-card">
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-inner rounded shadow-sm">
                                <div class="carousel-item active">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_1.jpg'}"
                                         class="d-block w-100" alt="Room Image 1">
                                </div>
                                <div class="carousel-item">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_2.jpg'}"
                                         class="d-block w-100" alt="Room Image 2">
                                </div>
                                <div class="carousel-item">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_3.jpg'}"
                                         class="d-block w-100" alt="Room Image 3">
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 d-flex flex-column justify-content-center">
                        <h2 class="room-title" th:text="'Room ' + ${room.roomNumber}">Room 101</h2>
                        <div class="mb-3">
                            <span class="room-label">Type:</span>
                            <span class="room-text" th:text="${room.roomType}"></span>
                        </div>
                        <div class="mb-4">
                            <span class="room-label">Extra Bed:</span>
                            <span class="room-text"
                                  th:text="${room.extraBedAvailable ? 'Yes' : 'No'}"></span>
                        </div>
                        <p class="room-text mb-4">A beautiful and cozy room perfect for your stay.</p>
                        <a th:href="@{/book(roomId=${room.id},startdate=${startdate},enddate=${enddate})}"
                           class="book-btn text-center text-decoration-none">Book Now
                        </a>
                        <div>
                            <button type="button" class="see-reviews-button" id="see-reviews-button">See reviews</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/modal :: modal}"></div>
</main>
<script type="module" th:src="@{/js/room.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
