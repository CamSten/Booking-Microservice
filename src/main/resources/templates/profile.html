<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body>
<div th:replace="~{fragments/hero :: hero(hideLogin=true)}"></div>
<div class="container my-5">
    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-8">
            <div class="booking-card text-center">
                <h2 class="mb-4" style="font-family: 'Playfair Display', serif; color: #5f4b45;">Customer Profile</h2>
                <div th:if="${deleteError}" class="alert alert-danger text-center" role="alert">
                    <p th:text="${deleteError}" class="m-0"></p>
                </div>
                <div th:if="${successMessage}" class="alert alert-success text-center" role="alert">
                    <p th:text="${successMessage}" class="m-0"></p>
                </div>
                <div th:if="${error}" class="alert alert-danger text-center" role="alert">
                    <p th:text="${error}" class="m-0"></p>
                </div>
                <input type="hidden" id="customer-id" th:value="${customer.id}">
                <div class="row text-start justify-content-center mt-4">
                    <div class="col-6 col-md-4 mb-3">
                        <label class="profile-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Name</label>
                        <p class="room-text" th:text="${customer.name}"></p>
                    </div>
                    <div class="col-6 col-md-4 mb-3">
                        <label class="profile-label" style= " color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Email</label>
                        <p class="room-text"  th:text="${customer.email}"></p>
                    </div>
                    <div class="col-6 col-md-4 mb-3">
                        <label class="profile-label" style= " color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Phone</label>
                        <p class="room-text" th:text="${customer.phone}"></p>
                    </div>
                    <div class="col-12 mb-4 text-center mt-3">
                        <label class="profile-label" style= " color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Address</label>
                        <p class="room-text" th:text="${customer.address}"></p>
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
                    <form th:action="@{/profile/edit}" method="get">
                        <button type="submit" class="modal-btn modal-btn-secondary">Edit Profile</button>
                    </form>
                    <form th:action="@{/logout}" method="get">
                        <button type="submit" class="modal-btn modal-btn-secondary" style="background: #e6e2df;">Logout</button>
                    </form>
                    <form th:action="@{/profile/delete}" method="post" id="delete-account-form">
                        <button type="submit" class="modal-btn modal-btn-danger" id="delete-account-button">
                            Delete Account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/bookingsection :: booking-section}"></div>
<div th:replace="~{fragments/modal :: modal}"></div>
<script type="module" th:src="@{/js/profile-bookings.js?v=3}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
