<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit profile')}"></head>
<body>
<div th:replace="~{fragments/hero :: hero(hideLogin=true)}"></div>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="booking-card">
                <h2 class="text-center mb-4" style="font-family: 'Playfair Display', serif; color: #5f4b45;">Edit Profile</h2>
                <div th:if="${editError}" class="alert alert-danger text-center" role="alert">
                    <p th:text="${editError}" class="m-0"></p>
                </div>
                <form th:action="@{/profile/edit}" th:object="${customer}" method="post">
                    <div class="mb-3">
                        <label class="form-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Address</label>
                        <input type="text" class="form-control" th:field="*{address}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" th:field="*{password}">
                    </div>
                    <button type="submit" class="book-btn mt-4">Save Changes</button>
                </form>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
