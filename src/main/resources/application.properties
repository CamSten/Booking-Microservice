spring.application.name=booking-app

spring.datasource.url = jdbc:mysql://localhost:3306/bookify?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

spring.datasource.username = bookify-user


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
customer.service.url=http://localhost:8081/api/customers